services:
  backend:
    build:
      context: ./server
    environment:
      DATABASE_URL: sqlite:////data/personal_finance_tracker.db
      SECRET_KEY: ${SECRET_KEY:-change-this-before-deployment}
      FLASK_ENV: production
    volumes:
      - ledgerly_data:/data
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ledgerly_data: